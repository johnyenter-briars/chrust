[package]
name = "chrust"
version = "0.2.0"
authors = ["John Yenter-Briars <jyenterbriars@gmail.com>"]
edition = "2021"
description = "Chess engine written in Rust"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
crossterm = { version = "0.27", features = [ "serde" ] }
chrono = { version = "0.4.26", features = ["serde"] }
rand = { version = "0.8.5", default-features = false, features = ["std", "std_rng"] }
tui = { version = "0.19", default-features = false, features = ['crossterm', 'serde'] }
thiserror = "1.0.44"
serde = "1.0.182"
serde_derive = "1.0.182"
serde_json = "1.0.104"
clap = "3.0.0-beta.4"
futures = "0.3.28"
actix-web = "4.0.1"
env_logger = "0.9.0"
itertools = "0.11.0"
actix-files = "0.6.2"
